<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Areth HSV Color Rarity Calculator</title>
  <style>
    :root{
      --bg:#f2f2f5;
      --card:#ffffff;
      --ink:#151426;
      --muted:rgba(21,20,38,.72);
      --border:rgba(21,20,38,.12);
      --accent:#6f57c7;
      --radius:22px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding: 28px 18px 44px;
    }
    .page{
      max-width: 1100px;
      margin: 0 auto;
      text-align:center;
    }
    h1{
      margin: 0 0 6px 0;
      font-size: 24px;
      letter-spacing: .2px;
      color: var(--accent);
    }
    .sub{
      margin: 0 0 22px 0;
      font-size: 16px;
      color: var(--muted);
    }

    .grid{
      display:grid;
      grid-auto-rows: 1fr;
      grid-template-columns: 1fr 1fr;
      gap: 26px;
      justify-content:center;
      align-items:stretch;
      margin: 22px auto 18px;
    }
    .card{
background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 18px 16px;
      box-shadow: 0 1px 0 rgba(0,0,0,.02);
      display:flex;
      flex-direction:column;
      height:100%;
    }

    
    .card-left{
      justify-content:center;
      align-items:center;
    }
    .card-left .rows{
      width:100%;
      align-items:center;
    }
/* LEFT column: compact */
    .rows{
      display:flex;
      flex-direction:column;
      gap: 4px;
      align-items:stretch;
    }
    .row{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap: 4px;
      padding: 0;
      border-radius: 0;
      border: none;
      background: transparent;
    }
    .inputs{
      display:flex;
      align-items:center;
      justify-content:center;
      gap: 6px;
      flex-wrap:wrap;
    }
    .num{
      width: 46px;
      height: 30px;
      font-size: 16px;
      text-align:center;
      border: 1.5px solid rgba(21,20,38,.28);
      border-radius: 6px;
      outline: none;
      background: #fff;
      padding: 1px 2px;
    }
    .num:focus{
      border-color: rgba(111,87,199,.75);
      box-shadow: 0 0 0 3px rgba(111,87,199,.14);
    }
    .swatch-sm{
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1.5px solid rgba(21,20,38,.28);
      background: transparent;
      margin-left: 6px;
    }
    .out{
      width: 100%;
      text-align:center;
      font-size: 16px;
      color: rgba(0,0,0,.92);
      line-height: 1.35;
      word-break: break-word;
      padding: 0 4px;
    }

    /* RIGHT column: big swatches */
    .swatch-grid{
      display:grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      justify-items:center;
      align-items:center;
      padding: 6px;
    }
    .swatch-big{
      width: 80px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid rgba(21,20,38,.18);
      background: transparent;
    }

    /* Generate */
    .actions{
      display:flex;
      justify-content:center;
      margin: 10px 0 10px;
    }
    .btn{
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: 800;
      font-size: 16px;
      padding: 10px 18px;
      border-radius: 999px;
      cursor:pointer;
    }
    .btn:active{transform: translateY(1px)}
    .export{
      margin-top: 10px;
    }
    .export p{
      margin: 0 0 12px;
      font-size: 16px;
      color: var(--muted);
    }
    textarea{
      width: 100%;
      min-height: 100px;
      resize: vertical;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid rgba(21,20,38,.20);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 14px;
      line-height: 1.35;
      background: #fff;
    }
    .copyrow{
      display:flex;
      justify-content:center;
      gap: 10px;
      margin-top: 10px;
    }
    .btn-secondary{
      border: 1px solid rgba(21,20,38,.18);
      background:#fff;
      color: var(--ink);
      font-weight: 800;
      font-size: 14px;
      padding: 10px 14px;
      border-radius: 999px;
      cursor:pointer;
    }

    @media (max-width: 980px){
      .grid{grid-template-columns: 1fr; max-width: 720px}
      .swatch-grid{grid-template-columns: repeat(4, 1fr)}
      h1{font-size: 24px}
      .sub{font-size: 16px}
    }
  </style>
</head>

<body>
  <div class="page">
    <h1>Areth HSV Color Rarity Calculator</h1>
    <p class="sub">Input HSV values on the left.
	The "Generate" button creates formatted codes needed for references or character submissions.</p>

    <div class="grid">
      <div class="card card-left">
        <div id="rows" class="rows"></div>
      </div>

      <div class="card">
        <div id="swatchGrid" class="swatch-grid"></div>

        <div class="actions">
          <button id="btnGen" class="btn" type="button">Generate</button>
        </div>

        <div class="export">
          <p>All outputs appear in one block for easy copy and paste. Each line includes a 50x50 swatch.</p>
          <textarea id="exportBox" readonly></textarea>
          <div class="copyrow">
            <button id="btnCopy" class="btn-secondary" type="button">Copy</button>
            <button id="btnClear" class="btn-secondary" type="button">Clear</button>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
/* ========= RARITY LOGIC UPDATED TO MATCH uploaded color_allowance_calculator_rarity_final.xlsx ========= */

/* helpers */
const isNum = (x) => Number.isFinite(x);
const toNum = (v) => {
  const n = Number(v);
  return Number.isFinite(n) ? n : NaN;
};
const mod360 = (h) => isNum(h) ? (((h % 360) + 360) % 360) : NaN;

/* Lines (same as sheet) */
const dullLine = (s) => isNum(s) ? (100 - (30/13) * (s - 1)) : NaN;      // J
const pbLine   = (s) => isNum(s) ? (70  + (15/13) * (s - 14)) : NaN;     // K
const brightLine = (s) => isNum(s) ? (100 - (30/13) * (s - 60)) : NaN;   // L
const eqLine     = (s) => isNum(s) ? (10  + (15/13) * (s - 60)) : NaN;   // M

/* Hue bucket (G column in sheet) */
const hueBucket = (hMod) => {
  if (!isNum(hMod)) return "";
  if (hMod <= 10 || hMod >= 351) return "Red";
  if (hMod <= 20) return "Red-orange";
  if (hMod <= 30) return "Orange";
  if (hMod <= 45) return "Yellow-orange (amber)";
  if (hMod <= 60) return "Yellow";
  if (hMod <= 80) return "Yellow-green";
  if (hMod <= 130) return "Green";
  if (hMod <= 165) return "Green-cyan";
  if (hMod <= 185) return "Cyan";
  if (hMod <= 200) return "Cyan-blue";
  if (hMod <= 240) return "Blue";
  if (hMod <= 255) return "Indigo (blue-purple)";
  if (hMod <= 270) return "Purple";
  if (hMod <= 290) return "Fuchsia (purple-pink)";
  if (hMod <= 315) return "Magenta";
  return "Amaranth";
};

/* Special category (N column) */
const specialCategory = (s, v) => {
  if (!isNum(s) || !isNum(v)) return "";
  if (v < 10) return "Illegal";
  if (s === 0 && v === 100) return "Pure White";
  if (s === 100 && v === 100) return "Neon";
  if (s === 100 && v >= 10 && v <= 99) return "Vivid";
  if (s === 0 && v >= 10 && v <= 99) return "Grayscale";
  return "";
};

/* Label booleans (O/P/Q/R) */
const isPastel = (s, v) => isNum(s) && isNum(v) &&
  (s >= 1 && s <= 40 && v >= 10 && v <= 100 && v > dullLine(s) && (s > 14 ? v >= pbLine(s) : true));

const isJewel = (s, v) => isNum(s) && isNum(v) &&
  (s >= 60 && s <= 99 && v >= 10 && v <= 100 && v < brightLine(s) && (s <= 86 ? v <= eqLine(s) : true));

const isBright = (s, v) => isNum(s) && isNum(v) &&
  (s >= 60 && s <= 99 && v >= 10 && v <= 100 && v >= brightLine(s));

const isDull = (s, v) => isNum(s) && isNum(v) &&
  (s >= 1 && s <= 40 && v >= 10 && v <= 100 && v <= dullLine(s));

/* Label (E column) */
const labelOf = (special, s, v) => {
  if (special !== "") return "";
  if (isPastel(s, v)) return "Pastel";
  if (isJewel(s, v)) return "Jewel";
  if (isBright(s, v)) return "Bright";
  if (isDull(s, v)) return "Dull";
  return "";
};

/* Category (F column) */
const categoryOf = (special, hMod, s, v) => {
  if (special !== "") return special;
  if (!isNum(hMod) || !isNum(s) || !isNum(v)) return "";
  if (hMod >= 11 && hMod <= 50 && s <= (150 - v)) return "Warm Natural";
  if (hMod >= 200 && hMod <= 235 && s <= ((100 - v) / 2)) return "Cool Natural";
  return "Unnatural";
};


/* Rarity (D column) */
const rarityOf = (special, label, category, s, v) => {
  if (special === "Illegal") return "Reject";
  if (special === "Pure White") return "Legendary";
  if (special === "Neon") return "Legendary";
  if (special === "Vivid") return "Ultra Rare";
  if (special === "Grayscale") return "Common";

  if (label === "Pastel"){
    if (v === 100) return "Legendary";
    if (v >= 97) return "Ultra Rare";
    return "Rare";
  }

  if (label === "Jewel"){
    const L = brightLine(s);
    if (!isNum(L) || L <= 10) return "";
    if (100*(v - 10) >= 83*(L - 10)) return "Legendary";
    if (2*(v - 10) >= (L - 10)) return "Ultra Rare";
    return "Rare";
  }

  if (label === "Bright"){
    if (v >= 85 || s >= 87) return "Legendary";
    if (v >= 62 || s >= 86) return "Ultra Rare";
    return "Rare";
  }

  if (label === "Dull"){
    const J = dullLine(s);
    if ((s <= 14 && v >= (J - 5)) || (s <= 3 && v >= 85)) return "Rare";
    if (s >= 23) return "Uncommon";
    return "Common";
  }

  if (category === "Unnatural"){
    if (v <= (s/2 + 50)) return "Uncommon";
    if (v <= (s/2 + 90)) return "Rare";
    return "Ultra Rare";
  }

  if (category === "Warm Natural"){
    // UPDATED IN SHEET: IF(V <= 100 - 0.5*S, "Common", "Uncommon")
    if (v <= (100 - 0.5*s)) return "Common";
    return "Uncommon";
  }

  if (category === "Cool Natural"){
    // UPDATED: IF(V <= 60 - 0.6*S, "Common", "Uncommon")
    if (v <= (60 - 0.6*s)) return "Common";
    return "Uncommon";
  }

  return "Common";
};

/* Color preview conversion */
const hsvToHex = (h, s, v) => {
  let f = (n, k = (n + h / 60) % 6) =>
    v - v * s / 100 * Math.max(Math.min(k, 4 - k, 1), 0);
  const r = Math.round(f(5) * 2.55);
  const g = Math.round(f(3) * 2.55);
  const b = Math.round(f(1) * 2.55);
  return "#" + [r, g, b].map(x => x.toString(16).padStart(2, "0")).join("");
};

const escapeHtml = (str) => String(str)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#39;");

/* ========= UI ========= */

const makeRow = (i) => {
  const row = document.createElement("div");
  row.className = "row";
  row.dataset.index = String(i);

  const inputs = document.createElement("div");
  inputs.className = "inputs";

  const inH = document.createElement("input");
  inH.className = "num";
  inH.inputMode = "numeric";
  inH.placeholder = "H";

  const inS = document.createElement("input");
  inS.className = "num";
  inS.inputMode = "numeric";
  inS.placeholder = "S";

  const inV = document.createElement("input");
  inV.className = "num";
  inV.inputMode = "numeric";
  inV.placeholder = "V";

  const sw = document.createElement("span");
  sw.className = "swatch-sm";

  const out = document.createElement("div");
  out.className = "out";

  const onChange = () => updateRow(i);
  inH.addEventListener("input", onChange);
  inS.addEventListener("input", onChange);
  inV.addEventListener("input", onChange);

  inputs.append(inH, inS, inV, sw);
  row.append(inputs, out);

  return row;
};

const getRowValues = (i) => {
  const row = document.querySelector(`.row[data-index="${i}"]`);
  const inps = row.querySelectorAll("input.num");
  const h = toNum(inps[0].value);
  const s = toNum(inps[1].value);
  const v = toNum(inps[2].value);
  return { row, h, s, v };
};

const updateRow = (i) => {
  const { row, h, s, v } = getRowValues(i);
  const swSm = row.querySelector(".swatch-sm");
  const out = row.querySelector(".out");
  const swBig = document.querySelector(`.swatch-big[data-index="${i}"]`);

  if (!isNum(h) || !isNum(s) || !isNum(v)){
    swSm.style.background = "";
    if (swBig) swBig.style.background = "";
    out.textContent = "";
    return;
  }

  const hex = hsvToHex(h, s, v);
  swSm.style.background = hex;
  if (swBig) swBig.style.background = hex;

  const hMod = mod360(h);
  const hue = hueBucket(hMod);

  const special = specialCategory(s, v);
  const label = labelOf(special, s, v);
  const category = categoryOf(special, hMod, s, v);
  const rarity = rarityOf(special, label, category, s, v);

  const labelShown = (label === "" ? "None" : label);

  // Output order requested: HSV / Category / Hue bucket / Label / Rarity
  out.textContent = `(${h},${s},${v}) / ${category} / ${hue} / ${labelShown} / ${rarity}`;
};

const generateExport = () => {
  const lines = [];
  for (let i=0;i<10;i++){
    const { h, s, v } = getRowValues(i);
    if (!isNum(h) || !isNum(s) || !isNum(v)) continue;

    const hex = hsvToHex(h, s, v);
    const hMod = mod360(h);
    const hue = hueBucket(hMod);

    const special = specialCategory(s, v);
    const label = labelOf(special, s, v);
    const category = categoryOf(special, hMod, s, v);
    const rarity = rarityOf(special, label, category, s, v);
    const labelShown = (label === "" ? "None" : label);

    const text = `(${h},${s},${v}) / ${category} / ${hue} / ${labelShown} / ${rarity}`;

    lines.push(
      `<div style="display:flex; align-items:center; gap:10px; margin:6px 0;">` +
      `<span style="width:50px; height:50px; display:inline-block; border:1px solid rgba(0,0,0,.25); border-radius:8px; background:${hex};"></span>` +
      `<span>${escapeHtml(text)}</span>` +
      `</div>`
    );
  }
  document.getElementById("exportBox").value = lines.join("\n");
};

const init = () => {
  const rows = document.getElementById("rows");
  const swatchGrid = document.getElementById("swatchGrid");

  for (let i=0;i<10;i++){
    rows.appendChild(makeRow(i));
    const big = document.createElement("div");
    big.className = "swatch-big";
    big.dataset.index = String(i);
    swatchGrid.appendChild(big);
  }

  document.getElementById("btnGen").addEventListener("click", generateExport);

  document.getElementById("btnCopy").addEventListener("click", async () => {
    const box = document.getElementById("exportBox");
    box.focus();
    box.select();
    try{ await navigator.clipboard.writeText(box.value); }catch(e){}
  });

  document.getElementById("btnClear").addEventListener("click", () => {
    document.getElementById("exportBox").value = "";
  });
};

window.addEventListener("load", init);
</script>
</body>
</html>
